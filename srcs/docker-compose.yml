services:
  mariadb:
    # build the image from our own Dockerfile
    build: requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    #load the variables from .env into the container
    env_file: .env
    # mount these secrets as files in /run/secrets
    secrets:
      - db_password
      - db_root_password
    # store the database files in the named volume
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    # restart the container if it crashes
    restart: unless-stopped
    # check if MariaDB is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u $$MYSQL_USER --password=$$(cat /run/secrets/db_password) --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wordpress:
    build: requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    # start only after the MariaDB healthcheck passes
    depends_on:
      mariadb:
        condition: service_healthy

# map each secret name to a file on the host
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

# named volumes that store their data in DATA_PATH on the host
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

# private network that connects the containers
networks:
  inception:
    driver: bridge
