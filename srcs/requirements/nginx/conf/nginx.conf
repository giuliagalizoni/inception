# one virtual server: WordPress site
server {
	# listen on port 443 with TLS (IPv4 and IPv6)
	listen 443 ssl;
	listen [::]:443 ssl;

	# the domain this server answers to
	server_name ggalizon.42.fr;

	# where the certificate and private key are (created by setup.sh)
	ssl_certificate /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;

	# allow only TLS 1.2 and 1.3 (subject requirement)
	ssl_protocols TLSv1.2 TLSv1.3;

	# folder with the WordPress files (shared volume with wordpress)
	root /var/www/html;

	# file to open when the URL is a folder, like "/"
	index index.php index.html;

	# normal requests: send the file if it exists, otherwise let WordPress handle it
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# .php requests: pass them to PHP-FPM in the wordpress container
	location ~ \.php$ {
		# return 404 if the php file does not exist (safety)
		try_files $uri =404;
		# load the standard FastCGI variables
		include fastcgi_params;
		# tell PHP-FPM the full path of the script to run
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		# send the request to the wordpress container on port 9000
		fastcgi_pass wordpress:9000;
	}
}
