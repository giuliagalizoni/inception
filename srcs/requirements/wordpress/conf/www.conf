[www]

; run PHP as the web user, not root
user = www-data
group = www-data

; listen on port 9000 on all interfaces, so nginx can reach it through the Docker network
listen = 9000

; how PHP-FPM manages its worker processes
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
